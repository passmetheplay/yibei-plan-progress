<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>计划卡 · 进度条与三项统计换位（4 版）</title>
<style>
  :root{
    --bg:#FFF8F0;--ink:#2A1F1A;--ink-2:#7C6A60;--ink-3:#B3A298;
    --orange:#FF7A45;--orange-deep:#E8590C;--amber:#FFB020;--mint:#1FBFA4;--mint-deep:#0E9C86;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);
    background:radial-gradient(900px 600px at 10% 4%,#FFE3D2 0%,transparent 58%),
      radial-gradient(800px 600px at 92% 96%,#DDF7EF 0%,transparent 58%),var(--bg);
    min-height:100dvh;padding:30px 20px 70px}
  h1,h2,p{margin:0}
  .head{max-width:860px;margin:0 auto 22px}
  .head .kick{font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--orange-deep)}
  .head h1{font-size:24px;letter-spacing:-.5px;margin:7px 0 8px}
  .head p{font-size:12.5px;color:var(--ink-2);line-height:1.7}
  .head p b{color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(2,394px);gap:26px 24px;justify-content:center;max-width:860px;margin:0 auto;align-items:start}
  .item{width:394px}

  .hero{position:relative;border-radius:24px;padding:14px 13px 16px;overflow:hidden;
    background:linear-gradient(160deg,#FFF8EE 0%,#FFEFDC 50%,#FFE6CC 100%);
    box-shadow:0 14px 30px rgba(200,140,90,.14)}
  .top{display:flex;align-items:center;gap:9px;padding:2px 3px 14px}
  .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:#fff;
    box-shadow:0 3px 9px rgba(180,140,100,.16)}
  .top h2{font-size:21px;font-weight:900;letter-spacing:-.5px}
  .banner{font-size:9.5px;font-weight:900;color:#fff;border-radius:8px;padding:6px 10px;
    background:linear-gradient(180deg,#FF8A4C,#F2601F);box-shadow:0 4px 10px rgba(220,90,30,.28)}
  .ribbon{position:absolute;right:0;top:0;height:46px;width:108px;
    background:linear-gradient(135deg,#FFDD7A,#FFB020);border-bottom-left-radius:38px;border-top-right-radius:24px}
  .ribbon span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:900;color:#6B3F00;letter-spacing:.4px}

  .inner{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(180,140,100,.10)}
  .book{position:relative;display:flex;gap:14px;align-items:center}
  .cover{position:relative;flex:none;width:74px;border-radius:8px;overflow:hidden;
    box-shadow:0 12px 24px rgba(150,95,45,.26),inset 0 0 0 1px rgba(255,255,255,.55)}
  .cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
    background:linear-gradient(90deg,rgba(120,60,20,.26),rgba(120,60,20,0))}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}

  .bi{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .txt h3{font-size:21px;line-height:1.15;letter-spacing:-.6px;padding-right:80px}
  .ver{font-size:10.5px;font-weight:800;color:#9AA79C;margin-top:5px}
  .units{font-size:10.5px;font-weight:800;color:#9AA79C;margin-top:5px}
  .units b{color:var(--ink);font-weight:900}

  .link{position:absolute;top:2px;right:0;
    font-size:9px;font-weight:900;color:var(--mint-deep);background:#E9FBF6;
    border-radius:999px;padding:5px 9px;white-space:nowrap}

  /* 现状：统计在书行里 */
  .book.base{align-items:stretch}
  .book.base .cover{width:88px}
  .base .bi{justify-content:space-between}
  .footrow{display:flex;align-items:baseline;gap:12px}
  .footrow div{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .footrow b{font-size:15px;font-weight:900}
  .footrow span{font-size:9.5px;font-weight:800;color:#A9A19A}

  /* 进度条 */
  .barrow{display:flex;align-items:center;gap:11px}
  .bar{position:relative;flex:1;height:10px;border-radius:999px;background:#F4EDE5;
    box-shadow:inset 0 1px 2px rgba(140,100,70,.10)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:42.37%;border-radius:999px;
    background:linear-gradient(90deg,#FFB07A,#FF7A45 55%,#FF6A2B);
    box-shadow:0 2px 7px rgba(232,89,12,.22)}
  .gate{position:absolute;right:1px;top:-2px;bottom:-2px;width:7px;border-radius:3px;z-index:4;opacity:.9;
    background-image:
      linear-gradient(45deg,#FF6A2B 25%,transparent 25%,transparent 75%,#FF6A2B 75%),
      linear-gradient(45deg,#FF6A2B 25%,#fff 25%,#fff 75%,#FF6A2B 75%);
    background-size:7px 7px;background-position:0 0,3.5px 3.5px}
  .inbar{position:absolute;right:20px;top:50%;transform:translateY(-50%);
    display:flex;align-items:baseline;gap:2px;color:#fff;z-index:3;
    font-size:9px;font-weight:900;text-shadow:0 1px 2px rgba(180,70,20,.35)}
  .inbar b{font-size:10.5px;font-weight:900;font-variant-numeric:tabular-nums}
  .inbar i{font-style:normal;font-size:7px;font-weight:900;opacity:.85}
  .rocket{position:absolute;left:42.37%;top:50%;z-index:6;width:22px;height:22px;line-height:0;
    transform:translate(-70%,-128%) rotate(45deg);
    filter:drop-shadow(0 4px 5px rgba(200,100,50,.32))}
  .rocket svg{display:block;width:100%;height:100%}
  .finish{flex:none;line-height:1.15}
  .finish b{display:block;font-size:10.5px;font-weight:800;color:#7C6A60;white-space:nowrap}

  /* 统计排布 */
  .stats{font-variant-numeric:tabular-nums}

  /* A 三等分 */
  .stats.a{display:grid;grid-template-columns:repeat(3,1fr);margin-top:15px}
  .stats.a > div{position:relative;padding-left:14px;display:flex;flex-direction:column;gap:3px}
  .stats.a > div:first-child{padding-left:0}
  .stats.a > div + div::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:#F3E9DF}
  .stats.a b{font-size:16px;font-weight:900;letter-spacing:-.3px}
  .stats.a b small{font-size:8.5px;font-weight:800;color:#B3A298;margin-left:2px}
  .stats.a span{font-size:9px;font-weight:800;color:#A9A19A}

  /* B 胶囊 */
  .stats.b{display:flex;gap:7px;margin-top:15px}
  .stats.b > div{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#FFF9F3;
    border:1px solid #F7E9DC;border-radius:12px;padding:7px 9px}
  .stats.b i{width:5px;height:5px;border-radius:50%;flex:none}
  .stats.b b{font-size:13.5px;font-weight:900;letter-spacing:-.2px}
  .stats.b b small{font-size:8px;color:#B3A298;font-weight:800;margin-left:1px}
  .stats.b span{font-size:8.5px;font-weight:800;color:#A9A19A;white-space:nowrap}

  /* C 一行 */
  .stats.c{display:flex;align-items:baseline;gap:7px;margin-top:13px;white-space:nowrap;
    font-size:9.5px;font-weight:800;color:#A9A19A}
  .stats.c b{font-size:12.5px;font-weight:900;color:var(--ink);margin-right:2px}
  .stats.c i{font-style:normal;color:#E6D8CB;font-weight:900}

  .cap{margin-top:14px;background:#fff;border-radius:16px;padding:14px 16px;
    box-shadow:0 8px 20px rgba(180,140,100,.08)}
  .cap h4{margin:0 0 8px;font-size:12.5px;font-weight:900;letter-spacing:-.2px}
  .cap h4 em{font-style:normal;color:var(--orange-deep);margin-right:6px}
  .cap ul{margin:0;padding-left:15px}
  .cap li{font-size:11px;line-height:1.75;color:var(--ink-2)}
  .cap li b{color:var(--ink)}
  .cap .fit{margin-top:9px;font-size:10.5px;font-weight:800;color:var(--mint-deep);background:#E9FBF6;
    border-radius:8px;padding:6px 9px;display:inline-block}

  @media (max-width:840px){ .grid{grid-template-columns:394px} }

  .meta{font-size:10.5px;font-weight:800;color:#9AA79C;margin-top:5px;letter-spacing:.1px;
    display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .meta i{font-style:normal;color:#A7B0A9}
  .meta em{font-style:normal;color:#DCD2C8;font-weight:900}
  .meta b{color:var(--ink);font-weight:900}
</style>
</head>
<body>

<div class="head">
  <div class="kick">计划学习 · 布局换位</div>
  <h1>进度条 vs 三项统计，换位置后的 3 种排法</h1>
  <p>共同点：<b>条在上、统计在下</b>，条紧贴书行，入口「查看进度」固定在书行右上。差别只在下面那排统计的"重量"：
    三等分 / 胶囊 / 一行小字。左上角那张是现状，用来对比。</p>
</div>

<div class="grid" id="grid"></div>

<script>
  const ROCKET = `<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2.2c2.7 2.3 4.1 5.5 4.1 8.9 0 2-.5 3.9-1.5 5.5l-2.6 1.5-2.6-1.5A11.2 11.2 0 0 1 7.9 11c0-3.4 1.4-6.6 4.1-8.9z"
          fill="#fff" stroke="#FF6A2B" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="12" cy="9.3" r="2.2" fill="#FFD27A" stroke="#FF6A2B" stroke-width="1.2"/>
    <path d="M7.9 14.2 5.4 17.9l3.4-1.3z" fill="#FF7A45"/>
    <path d="M16.1 14.2l2.5 3.7-3.4-1.3z" fill="#FF7A45"/>
    <path d="M12 18.6c1.1 1.3 1.5 2.8 0 4.2-1.5-1.4-1.1-2.9 0-4.2z" fill="#FFB020"/>
  </svg>`;

  const COVER = `data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 156'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23FFEBCB'/%3E%3Cstop offset='1' stop-color='%23E9944F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='112' height='156' fill='url(%23s)'/%3E%3Ccircle cx='86' cy='34' r='13' fill='%23FFD27A' opacity='.9'/%3E%3Cpath d='M0 104 Q30 78 58 104 T112 98 V156 H0Z' fill='%23DC8244'/%3E%3Cpath d='M0 124 Q34 104 64 124 T112 118 V156 H0Z' fill='%23B9612C'/%3E%3Crect x='18' y='16' width='74' height='44' rx='7' fill='%23FFFBF4' opacity='.96'/%3E%3Ctext x='55' y='36' font-size='17' font-weight='bold' fill='%238A4A18' text-anchor='middle' font-family='PingFang SC,sans-serif'%3E%E8%8B%B1%E8%AF%AD%3C/text%3E%3Ctext x='55' y='50' font-size='7.5' fill='%23A9765A' text-anchor='middle' font-family='PingFang SC,sans-serif'%3E%E4%BA%94%E5%B9%B4%E7%BA%A7%E4%B8%8A%E5%86%8C%3C/text%3E%3C/svg%3E`;

  const D = { learned:50, reviewed:32, mastered:18, pct:42.37, total:118, eta:'预计 11/28' };

  function statsHtml(kind){
    if (kind === 'a') return `
      <div class="stats a">
        <div><b>${D.learned}<small>词</small></b><span>已学</span></div>
        <div><b>${D.reviewed}<small>词</small></b><span>已复习</span></div>
        <div><b>${D.mastered}<small>词</small></b><span>已掌握</span></div>
      </div>`;
    if (kind === 'b') return `
      <div class="stats b">
        <div><i style="background:#FF7A45"></i><b>${D.learned}<small>词</small></b><span>已学</span></div>
        <div><i style="background:#1FBFA4"></i><b>${D.reviewed}<small>词</small></b><span>已复习</span></div>
        <div><i style="background:#FFB020"></i><b>${D.mastered}<small>词</small></b><span>已掌握</span></div>
      </div>`;
    return `
      <div class="stats c">
        <b>${D.learned}</b>已学 <i>·</i> <b>${D.reviewed}</b>已复习 <i>·</i> <b>${D.mastered}</b>已掌握
      </div>`;
  }

  function card(o){
    const base = o.kind === 'base';
    return `
    <div class="item">
      <div class="hero">
        <div class="ribbon"><span>切换教材</span></div>
        <div class="top"><div class="ico">🗓️</div><h2>计划学习</h2><span class="banner">艾宾浩斯记忆法</span></div>

        <div class="inner">
          <div class="book ${base ? 'base' : ''}">
            <div class="cover"><img alt="封面" src="${COVER}"></div>
            <div class="bi">
              <span class="link">查看进度 ›</span>
              <div class="txt">
                <h3>五年级上册</h3>
                <div class="meta"><i>人教PEP版</i><em>·</em><b>2–6 单元</b><em>·</em>共 <b>118</b> 词</div>
              </div>
              ${base ? `<div class="footrow">
                <div><b>${D.learned}</b><span>已学</span></div>
                <div><b>${D.reviewed}</b><span>已复习</span></div>
                <div><b>${D.mastered}</b><span>已掌握</span></div>
              </div>` : ''}
            </div>
          </div>

          <div class="barrow" style="margin-top:${base ? 28 : 26}px">
            <div class="bar">
              <div class="fill" style="width:${D.pct}%">
                <span class="inbar"><b>${D.learned}</b><i>词</i></span>
              </div>
              <div class="gate"></div>
              <div class="rocket">${ROCKET}</div>
            </div>
            <div class="finish"><b>${D.eta}</b></div>
          </div>

          ${base ? '' : statsHtml(o.kind)}
        </div>
      </div>

      <div class="cap">
        <h4><em>${o.tag}</em></h4>
        <ul>${o.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
        <div class="fit">${o.fit}</div>
      </div>
    </div>`;
  }

  const CARDS = [
    {
      kind:'base', tag:'现状', fit:'省高度，但条离书名远、和统计抢视觉',
      bullets:[
        '三项统计塞在书行底部，和书名同区',
        '进度条要等 32px 才出现，像是另一个模块',
        '书行很高，信息密度实际上偏低'
      ]
    },
    {
      kind:'a', tag:'A 三等分', fit:'层级最清楚：书名 → 条 → 数据',
      bullets:[
        '条紧贴书行，<b>第一眼看到进度</b>',
        '三项统计三等分，用细竖线分隔，像仪表盘',
        '数字带「词」单位，标签在下，读数最快'
      ]
    },
    {
      kind:'b', tag:'B 胶囊', fit:'最软的一版，适合孩子，不像报表',
      bullets:[
        '统计变成三个浅底胶囊，<b>没有表格感</b>',
        '每项一个色点：橙=已学、绿=已复习、黄=已掌握',
        '卡片略高，但三块信息彼此不打架'
      ]
    },
    {
      kind:'c', tag:'C 一行小字', fit:'最省高度，统计降级成注释',
      bullets:[
        '条 + 一行小字，<b>头部最短</b>',
        '统计只作为补充，不参与视觉竞争',
        '适合头部下面还要放今日任务的重页面'
      ]
    }
  ];

  document.getElementById('grid').innerHTML = CARDS.map(card).join('');
</script>
</body>
</html>
